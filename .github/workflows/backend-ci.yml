name: Safety360 Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "safety360-*"
  pull_request:
    branches:
      - main
      - "safety360-*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Lint
        run: ruff check .

      - name: Verify migrations
        env:
          DATABASE_URL: sqlite:///./migration_test.db
        run: |
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, inspect

          engine = create_engine("sqlite:///./migration_test.db")
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          required = {
              "alembic_version",
              "tenants",
              "tenant_invitations",
              "users",
              "tickets",
              "documents",
              "stored_files",
              "file_ingestion_records",
              "assistant_threads",
              "assistant_messages",
              "tenant_subscriptions",
              "ims_activities",
              "ims_artifacts",
              "agent_runs",
              "agent_feedback",
              "tenant_identity_providers",
              "federated_identities",
              "sso_exchange_codes",
              "privacy_processing_activities",
              "privacy_impact_assessments",
              "privacy_retention_rules",
              "privacy_data_subject_requests",
              "regulatory_sources",
              "regulatory_requirements",
              "regulatory_changes",
              "industry_classifications",
              "tenant_industry_profiles",
              "industry_activity_templates",
              "dguv_publications",
              "dguv_catalog_changes",
              "compliance_subjects",
              "requirement_relations",
              "applicability_assessments",
              "regulatory_impact_actions",
              "tenant_integrations",
              "integration_events",
              "occupational_health_requirements",
              "occupational_health_cases",
              "occupational_health_appointments",
              "occupational_health_evidence",
              "occupational_health_notifications",
              "learning_content_packs",
              "learning_artifacts",
              "content_dependencies",
              "content_impact_assessments",
              "audit_log",
          }
          missing = required - tables
          if missing:
              raise SystemExit(f"Missing migrated tables: {sorted(missing)}")

          pack_columns = {column["name"] for column in inspector.get_columns("learning_content_packs")}
          if "currentness_status" not in pack_columns:
              raise SystemExit("Missing learning_content_packs.currentness_status")

          print("Migration tables verified:", sorted(tables))
          PY

      - name: Run tests with coverage
        run: pytest -q --cov=. --cov-report=term-missing
