name: Safety360 Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - safety360-phase1-auth
      - safety360-platform-core
      - safety360-i18n-core
      - safety360-agent-orchestration
      - safety360-agent-memory
      - safety360-secure-ingestion
  pull_request:
    branches:
      - main
      - safety360-platform-core
      - safety360-i18n-core
      - safety360-agent-orchestration
      - safety360-agent-memory

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Lint
        run: ruff check .

      - name: Verify migrations
        env:
          DATABASE_URL: sqlite:///./migration_test.db
        run: |
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, inspect

          engine = create_engine("sqlite:///./migration_test.db")
          tables = set(inspect(engine).get_table_names())
          required = {
              "alembic_version",
              "tenants",
              "tenant_invitations",
              "users",
              "tickets",
              "documents",
              "stored_files",
              "file_ingestion_records",
              "assistant_threads",
              "assistant_messages",
              "tenant_subscriptions",
              "ims_activities",
              "ims_artifacts",
              "agent_runs",
              "agent_feedback",
              "tenant_identity_providers",
              "federated_identities",
              "sso_exchange_codes",
              "audit_log",
          }
          missing = required - tables
          if missing:
              raise SystemExit(f"Missing migrated tables: {sorted(missing)}")
          print("Migration tables verified:", sorted(tables))
          PY

      - name: Run tests with coverage
        run: pytest -q --cov=. --cov-report=term-missing
