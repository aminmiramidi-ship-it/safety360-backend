name: Safety360 Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "safety360-*"
  pull_request:
    branches:
      - main
      - "safety360-*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Lint
        run: ruff check .

      - name: Verify migrations
        env:
          DATABASE_URL: sqlite:///./migration_test.db
        run: |
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, inspect

          engine = create_engine("sqlite:///./migration_test.db")
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          required = {
              "alembic_version",
              "tenants",
              "tenant_invitations",
              "users",
              "tickets",
              "documents",
              "stored_files",
              "file_ingestion_records",
              "assistant_threads",
              "assistant_messages",
              "tenant_subscriptions",
              "ims_activities",
              "ims_artifacts",
              "agent_runs",
              "agent_feedback",
              "tenant_identity_providers",
              "federated_identities",
              "sso_exchange_codes",
              "privacy_processing_activities",
              "privacy_impact_assessments",
              "privacy_retention_rules",
              "privacy_data_subject_requests",
              "regulatory_sources",
              "regulatory_requirements",
              "regulatory_changes",
              "industry_classifications",
              "tenant_industry_profiles",
              "industry_activity_templates",
              "dguv_publications",
              "dguv_catalog_changes",
              "compliance_subjects",
              "requirement_relations",
              "applicability_assessments",
              "regulatory_impact_actions",
              "tenant_integrations",
              "integration_events",
              "occupational_health_requirements",
              "occupational_health_cases",
              "occupational_health_appointments",
              "occupational_health_evidence",
              "occupational_health_notifications",
              "learning_content_packs",
              "learning_artifacts",
              "content_dependencies",
              "content_impact_assessments",
              "realtime_access_tickets",
              "browser_sessions",
              "audit_chain_heads",
              "audit_events",
              "login_throttles",
              "webauthn_user_handles",
              "passkey_credentials",
              "webauthn_ceremonies",
              "audit_log",
          }
          missing = required - tables
          if missing:
              raise SystemExit(f"Missing migrated tables: {sorted(missing)}")

          pack_columns = {column["name"] for column in inspector.get_columns("learning_content_packs")}
          if "currentness_status" not in pack_columns:
              raise SystemExit("Missing learning_content_packs.currentness_status")

          ticket_columns = {column["name"] for column in inspector.get_columns("realtime_access_tickets")}
          expected_ticket_columns = {"token_hash", "user_id", "tenant_id", "expires_at", "used_at"}
          if not expected_ticket_columns.issubset(ticket_columns):
              raise SystemExit("Realtime ticket schema is incomplete")

          session_columns = {column["name"] for column in inspector.get_columns("browser_sessions")}
          expected_session_columns = {
              "session_hash",
              "csrf_hash",
              "user_id",
              "tenant_id",
              "expires_at",
              "revoked_at",
          }
          if not expected_session_columns.issubset(session_columns):
              raise SystemExit("Browser session schema is incomplete")

          audit_columns = {column["name"] for column in inspector.get_columns("audit_events")}
          expected_audit_columns = {
              "event_id",
              "scope_key",
              "sequence",
              "tenant_id",
              "actor_user_id",
              "action",
              "object_type",
              "object_id",
              "outcome",
              "source",
              "details_json",
              "previous_hash",
              "record_hash",
              "key_id",
              "created_at",
          }
          if not expected_audit_columns.issubset(audit_columns):
              raise SystemExit("Structured audit schema is incomplete")

          throttle_columns = {column["name"] for column in inspector.get_columns("login_throttles")}
          expected_throttle_columns = {
              "key_type",
              "key_hash",
              "failed_attempts",
              "window_started_at",
              "last_failed_at",
              "locked_until",
              "updated_at",
          }
          if not expected_throttle_columns.issubset(throttle_columns):
              raise SystemExit("Login throttle schema is incomplete")

          passkey_columns = {column["name"] for column in inspector.get_columns("passkey_credentials")}
          expected_passkey_columns = {
              "credential_id",
              "credential_public_key",
              "sign_count",
              "user_id",
              "tenant_id",
              "backed_up",
              "created_at",
              "last_used_at",
              "revoked_at",
          }
          if not expected_passkey_columns.issubset(passkey_columns):
              raise SystemExit("Passkey credential schema is incomplete")

          ceremony_columns = {column["name"] for column in inspector.get_columns("webauthn_ceremonies")}
          expected_ceremony_columns = {
              "ceremony_id",
              "purpose",
              "user_id",
              "challenge",
              "expires_at",
              "used_at",
          }
          if not expected_ceremony_columns.issubset(ceremony_columns):
              raise SystemExit("WebAuthn ceremony schema is incomplete")

          print("Migration tables verified:", sorted(tables))
          PY

      - name: Run tests with coverage
        run: pytest -q --cov=. --cov-report=term-missing
